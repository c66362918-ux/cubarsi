<title>愛足球⚽️賽程表</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #f1f4ec;
  --surface: #ffffff;
  --surface-alt: #e8efe0;
  --ink: #15201a;
  --ink-muted: #5c6b5c;
  --line: #d9e0d0;
  --accent: #b97b1f;
  --accent-ink: #ffffff;
  --dazn-bg: #e7edf7; --dazn-ink: #24447a; --dazn-dot: #3865ad;
  --elta-bg: #faeed9; --elta-ink: #7a4c12; --elta-dot: #c98a2c;
  --tba-bg: #eef0e8; --tba-ink: #6b7568; --tba-dot: #97a08e;
  --none-bg: #f1eeea; --none-ink: #8a8175;
  --shadow: 0 1px 2px rgba(21,32,26,.06), 0 4px 14px rgba(21,32,26,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1712; --surface: #142019; --surface-alt: #1a291f;
    --ink: #e9efe4; --ink-muted: #94a693; --line: #253526;
    --accent: #e3a94a; --accent-ink: #241705;
    --dazn-bg: #16233d; --dazn-ink: #9dc1f4; --dazn-dot: #5f8fd6;
    --elta-bg: #392a10; --elta-ink: #f0c987; --elta-dot: #e3a94a;
    --tba-bg: #202b22; --tba-ink: #9fac97; --tba-dot: #5c6b5c;
    --none-bg: #241f19; --none-ink: #a89c88;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0d1712; --surface: #142019; --surface-alt: #1a291f;
  --ink: #e9efe4; --ink-muted: #94a693; --line: #253526;
  --accent: #e3a94a; --accent-ink: #241705;
  --dazn-bg: #16233d; --dazn-ink: #9dc1f4; --dazn-dot: #5f8fd6;
  --elta-bg: #392a10; --elta-ink: #f0c987; --elta-dot: #e3a94a;
  --tba-bg: #202b22; --tba-ink: #9fac97; --tba-dot: #5c6b5c;
  --none-bg: #241f19; --none-ink: #a89c88;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "IBM Plex Mono", sans-serif;
  font-size: 21px;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

header.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding: 14px 16px 0;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: 16px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--accent); font-weight: 600;
}
h1 {
  font-family: "Oswald", "Noto Sans TC", sans-serif;
  font-weight: 600; font-size: 48px; margin: 6px 0 15px;
}
.callout {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
  padding: 16px 18px; margin-bottom: 15px; font-size: 21px; color: var(--ink-muted);
  line-height: 1.5;
}
.callout strong { color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #4a9a5c; flex: none; margin-top: 8px; }

nav.tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 15px;
  -ms-overflow-style: none; scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  flex: none; display: inline-flex; align-items: center; gap: 8px;
  font-family: "Noto Sans TC", sans-serif; font-size: 22px; font-weight: 600;
  padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-muted);
  white-space: nowrap;
}
nav.tabs button img { width: 32px; height: 32px; object-fit: contain; background: #fff; border-radius: 7px; padding: 3px; }
nav.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.clubrow {
  display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 17px;
  -ms-overflow-style: none; scrollbar-width: none;
}
.clubrow::-webkit-scrollbar { display: none; }
.clubchip {
  flex: none; display: flex; align-items: center; gap: 9px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 11px 20px 11px 13px; font-size: 21px; font-weight: 500; color: var(--ink);
}
.clubchip img { width: 32px; height: 32px; object-fit: contain; }
.clubchip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.clubchip.reset { font-family: "IBM Plex Mono", monospace; }

main { padding: 12px 16px 0; }

.date-hd {
  font-family: "Oswald", sans-serif; font-weight: 600; font-size: 28px;
  color: var(--ink); background: var(--surface-alt);
  border-radius: 10px; padding: 13px 18px; margin: 24px 0 14px;
  display: flex; align-items: baseline; gap: 12px;
}
.date-hd:first-child { margin-top: 4px; }
.date-hd .wd { font-family: "IBM Plex Mono", monospace; font-size: 20px; color: var(--ink-muted); font-weight: 500; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); padding: 18px 19px; margin-bottom: 15px;
}
.card.hidden { display: none; }
.card-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 12px;
}
.card-time {
  font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 27px;
  font-variant-numeric: tabular-nums; color: var(--accent); flex: none;
}
.card-time .approx { font-size: 14px; color: var(--accent); font-weight: 600; margin-left: 4px; }
.card-comp { display: inline-flex; align-items: center; gap: 8px; font-family: "IBM Plex Mono", monospace; font-size: 15px; color: var(--ink-muted); text-align: right; }
.card-comp img { width: 42px; height: 42px; object-fit: contain; background: #fff; border-radius: 8px; padding: 3px; }
.card-teams { display: flex; flex-direction: column; gap: 9px; }
.card-teams .tm { display: flex; align-items: center; gap: 13px; font-size: 29px; font-weight: 600; line-height: 1.25; }
.card-teams .tm span { flex: 1; min-width: 0; overflow-wrap: break-word; }
.card-teams img { width: 42px; height: 42px; object-fit: contain; flex: none; }
.card-teams img.flag { width: 34px; height: 25px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(128,128,128,.35); }
.card-teams .tm.tracked { font-weight: 800; }
.card-teams .vs { color: var(--ink-muted); font-family: "IBM Plex Mono", monospace; font-size: 15px; padding-left: 55px; margin: -4px 0; }

.card-meta { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 16px; }
.badge {
  display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
  padding: 9px 16px; font-size: 18px; font-weight: 600; white-space: nowrap;
}
.badge .bdot { width: 8px; height: 8px; border-radius: 50%; }
.badge.dazn { background: var(--dazn-bg); color: var(--dazn-ink); }
.badge.dazn .bdot { background: var(--dazn-dot); }
.badge.elta { background: var(--elta-bg); color: var(--elta-ink); }
.badge.elta .bdot { background: var(--elta-dot); }
.badge.tba { background: var(--tba-bg); color: var(--tba-ink); font-weight: 500; }
.badge.tba .bdot { background: var(--tba-dot); }
.badge.none { background: var(--none-bg); color: var(--none-ink); font-weight: 500; }
.badge.venue { background: none; border: 1px solid var(--line); color: var(--ink-muted); font-weight: 500; }

.card-stars { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.card-star { font-size: 20px; color: var(--ink-muted); display: flex; align-items: center; gap: 10px; }
.card-star b { color: var(--ink); font-weight: 600; }
.card-star img.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: center top; border: 1.5px solid var(--line); flex: none; }
.card-star .star-text { display: flex; flex-direction: column; gap: 2px; }
.card-star .squad-num { display: inline-block; margin-left: 6px; padding: 1px 7px; font-weight: 800; font-size: 15px; color: #fff; background: var(--accent); border-radius: 5px; vertical-align: middle; }
.card-star .club-affil { display: flex; align-items: center; gap: 5px; font-size: 15px; color: var(--ink-muted); opacity: 0.85; }
.card-star .club-affil img { width: 18px; height: 18px; object-fit: contain; flex: none; }
.card-star .club-affil .squad-num { font-size: 13px; padding: 0 5px; }

.card-note { margin-top: 14px; font-size: 18px; color: var(--ink-muted); line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 14px; }

.video-embed { margin-top: 14px; }
.video-frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-caption { margin-top: 7px; font-size: 13px; color: var(--ink-muted); font-family: "IBM Plex Mono", monospace; }

.video-linkout {
  display: flex; align-items: center; gap: 14px;
  background: #16151f; border-radius: 12px; padding: 16px;
  text-decoration: none; color: #fff;
}
.video-linkout-play {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: #fff200; color: #16151f; display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.video-linkout-text { min-width: 0; }
.video-linkout-title { font-size: 17px; font-weight: 600; overflow-wrap: break-word; }
.video-linkout .video-caption { color: #b8b6c8; }
.match-overview {
  background: #2c2c2e; border-radius: 18px; padding: 18px 22px;
  margin-top: 12px; color: #c8c8c8; font-size: 16px; line-height: 2;
  display: flex; gap: 16px;
}
.match-overview .mo-col { flex: 1; min-width: 0; }
.match-overview .mo-col-away { text-align: right; }
.match-overview .og { color: #9a9a9c; }

.tbc-card {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px;
  padding: 17px 19px; margin-bottom: 12px; font-size: 20px; color: var(--ink-muted);
}
.tbc-card .card-teams { margin-bottom: 8px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 9px; }
.tbc-card .card-teams .tm { font-size: 20px; }
.tbc-card .card-teams img { width: 28px; height: 28px; }
.tbc-card .card-teams .vs { padding-left: 0; margin: 0; }
.tbc-card .weekof { font-size: 17px; }

.panel { display: none; }
.panel.active { display: block; }

footer {
  margin-top: 34px; padding: 19px 16px; border-top: 1px solid var(--line);
  color: var(--ink-muted); font-size: 17px; line-height: 1.7;
}
footer strong { color: var(--ink); }
footer div + div { margin-top: 6px; }

</style>

<div id="app"></div>
<script src="schedule_data.js"></script>
<script>
const WD = ["週日","週一","週二","週三","週四","週五","週六"];
let activeClub = null;

function fmtTime(d) { return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDateHeader(d) { return `${d.getMonth()+1}月${d.getDate()}日`; }

function lookupInfo(name) {
  if (CN_TO_EN_CLUB[name] && CLUBS[CN_TO_EN_CLUB[name]]) {
    const c = CLUBS[CN_TO_EN_CLUB[name]];
    return { crest: c.crest, player: c.player_name };
  }
  if (TEAM_INFO[name]) return TEAM_INFO[name];
  if (COUNTRY_INFO[name]) return COUNTRY_INFO[name];
  return null;
}
function crestTag(name) {
  const info = CLUBS[name] ? { crest: CLUBS[name].crest } : lookupInfo(name);
  if (!info) return '';
  const flag = FLAGS[name] ? `<img class="flag" src="${FLAGS[name]}" alt="" loading="lazy">` : '';
  return `${flag}<img src="${info.crest}" alt="" loading="lazy">`;
}
function compTagHTML(comp) {
  const logo = COMPETITION_LOGOS[comp];
  return `<span class="card-comp">${logo ? `<img src="${logo}" alt="">` : ''}${comp}</span>`;
}
function badgeHtml(f) {
  const b = f.display || f.broadcaster;
  let cls = 'elta';
  if (b.startsWith('DAZN')) cls = 'dazn';
  else if (b.includes('待公布')) cls = 'tba';
  else if (b.includes('無確認')) cls = 'none';
  return `<span class="badge ${cls}"><span class="bdot"></span>${b}</span>`;
}

function starCardHTML(playerName, teamLabel, isCountry) {
  const stat = PLAYER_STATS[playerName];
  const photo = stat && stat.photo ? `<img class="avatar" src="${stat.photo}" alt="" loading="lazy">` : '';
  const numHTML = stat && stat.number ? `<span class="squad-num">${stat.number}</span>` : '';
  const clubAffil = (isCountry && stat && stat.club && stat.club_crest) ?
    `<div class="club-affil"><img src="${stat.club_crest}" alt="" loading="lazy">${stat.club}${stat.number ? ` <span class="squad-num">${stat.number}</span>` : ''}</div>` : '';
  return `<div class="card-star">${photo}<div class="star-text"><div><b>${playerName}</b>${numHTML} · ${teamLabel}</div>${clubAffil}</div></div>`;
}

function renderFixtureCards(container, list) {
  const sorted = [...list].sort((a,b) => new Date(a.kickoff) - new Date(b.kickoff));
  let lastKey = null;
  let html = '';
  sorted.forEach(f => {
    const d = new Date(f.kickoff);
    const key = dateKey(d);
    if (key !== lastKey) {
      lastKey = key;
      html += `<div class="date-hd" data-key="${key}">${fmtDateHeader(d)}<span class="wd">${WD[d.getDay()]}</span></div>`;
    }
    const homeT = f.tracked.includes(f.home);
    const awayT = f.tracked.includes(f.away);
    const stars = f.tracked.map(name => {
      const c = CLUBS[name];
      return c ? starCardHTML(c.player_name, name, false) : '';
    }).join('');
    html += `<div class="card" data-tracked="${f.tracked.join(',')}">
      <div class="card-head">
        <span class="card-time">${fmtTime(d)}${f.approx ? '<span class="approx">約</span>' : ''}</span>
        ${compTagHTML(f.competition)}
      </div>
      <div class="card-teams">
        <div class="tm ${homeT?'tracked':''}">${crestTag(f.home)}<span>${f.home}</span></div>
        <div class="vs">vs</div>
        <div class="tm ${awayT?'tracked':''}">${crestTag(f.away)}<span>${f.away}</span></div>
      </div>
      <div class="card-meta">${badgeHtml(f)}<span class="badge venue">${f.venue}</span></div>
      <div class="card-stars">${stars}</div>
      ${(d < new Date() && VIDEOS[f.id]) ? videoEmbedHTML(VIDEOS[f.id]) + matchOverviewHTML(f.id) : ''}
    </div>`;
  });
  container.innerHTML = html;
}

function minuteSortKey(minute) {
  const m = minute.replace("'", '').split('+');
  return parseInt(m[0], 10) + (m[1] ? parseInt(m[1], 10) / 100 : 0);
}

function groupScorers(events) {
  const groups = [];
  const byScorer = new Map();
  events.forEach(e => {
    if (!byScorer.has(e.scorer)) {
      const g = { scorer: e.scorer, minutes: [], og: false, firstKey: minuteSortKey(e.minute) };
      byScorer.set(e.scorer, g);
      groups.push(g);
    }
    const g = byScorer.get(e.scorer);
    g.minutes.push(e.minute);
    if (e.og) g.og = true;
  });
  groups.sort((a, b) => a.firstKey - b.firstKey);
  return groups;
}

function matchOverviewHTML(fixtureId) {
  const events = MATCH_EVENTS[fixtureId];
  if (!events || !events.length) return '';
  const homeGroups = groupScorers(events.filter(e => e.team === 'home'));
  const awayGroups = groupScorers(events.filter(e => e.team === 'away'));
  const colHTML = groups => groups.map(g =>
    `<div>${g.scorer} ${g.minutes.join(', ')}${g.og ? ' <span class="og">(烏龍球)</span>' : ''}</div>`
  ).join('');
  return `<div class="match-overview">
    <div class="mo-col">${colHTML(homeGroups)}</div>
    <div class="mo-col mo-col-away">${colHTML(awayGroups)}</div>
  </div>`;
}

function videoEmbedHTML(v) {
  if (v.type === 'dazn') {
    return `<a class="video-embed video-linkout" href="${v.url}" target="_blank" rel="noopener">
      <div class="video-linkout-play">▶</div>
      <div class="video-linkout-text">
        <div class="video-linkout-title">${v.title}</div>
        <div class="video-caption">前往 ${v.channel}</div>
      </div>
    </a>`;
  }
  return `<div class="video-embed">
    <div class="video-frame"><iframe src="https://www.youtube.com/embed/${v.id}" title="${v.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
    <div class="video-caption">精彩片段 · ${v.channel}</div>
  </div>`;
}

function renderTBC(container) {
  container.innerHTML = TBC.map(f => `<div class="tbc-card" data-tracked="${f.tracked.join(',')}">
    <div class="card-teams">${crestTag(f.home)}${f.home}<span class="vs">vs</span>${crestTag(f.away)}${f.away}</div>
    <div class="weekof">${f.competition} · ${f.weekOf} · ${badgeHtml(f)}</div>
  </div>`).join('');
}

function renderGenericCards(container, list, withNotes) {
  const sorted = [...list].sort((a,b) => new Date(a.kickoff) - new Date(b.kickoff));
  let lastKey = null;
  let html = '';
  sorted.forEach(m => {
    const d = new Date(m.kickoff);
    const key = dateKey(d);
    if (key !== lastKey) {
      lastKey = key;
      html += `<div class="date-hd">${fmtDateHeader(d)}<span class="wd">${WD[d.getDay()]}</span></div>`;
    }
    const hi = lookupInfo(m.home), ai = lookupInfo(m.away);
    const stars = (hi ? starCardHTML(hi.player, m.home, !!COUNTRY_INFO[m.home]) : '') +
                  (ai ? starCardHTML(ai.player, m.away, !!COUNTRY_INFO[m.away]) : '');
    const note = withNotes ? (UCL_NOTES[`${m.home}|${m.away}`] || '') : '';
    const genericVideo = GENERIC_VIDEOS[`${m.home}|${m.away}`];
    html += `<div class="card">
      <div class="card-head">
        <span class="card-time">${fmtTime(d)}</span>
      </div>
      <div class="card-teams">
        <div class="tm">${crestTag(m.home)}<span>${m.home}</span></div>
        <div class="vs">vs</div>
        <div class="tm">${crestTag(m.away)}<span>${m.away}</span></div>
      </div>
      <div class="card-meta"><span class="badge elta"><span class="bdot"></span>${m.channel}</span></div>
      <div class="card-stars">${stars}</div>
      ${note ? `<div class="card-note">${note}</div>` : ''}
      ${(d < new Date() && genericVideo) ? videoEmbedHTML(genericVideo) : ''}
    </div>`;
  });
  container.innerHTML = html;
}

function setClubFilter(club) {
  activeClub = club;
  document.querySelectorAll('.clubchip').forEach(c => {
    c.classList.toggle('active', (club === null && c.classList.contains('reset')) || c.dataset.club === club);
  });
  document.querySelectorAll('#panel-tracked .card').forEach(card => {
    const show = !club || card.dataset.tracked.split(',').includes(club);
    card.classList.toggle('hidden', !show);
  });
  document.querySelectorAll('#panel-tracked .date-hd').forEach(hd => {
    const anyVisible = document.querySelector(`#panel-tracked .card[data-key-group="${hd.dataset.key}"]:not(.hidden)`);
    // fall back: check next siblings until next date-hd
    let el = hd.nextElementSibling, any = false;
    while (el && !el.classList.contains('date-hd')) {
      if (el.classList.contains('card') && !el.classList.contains('hidden')) any = true;
      el = el.nextElementSibling;
    }
    hd.style.display = any ? '' : 'none';
  });
  document.querySelectorAll('#panel-tbc .tbc-card').forEach(card => {
    const show = !club || card.dataset.tracked.split(',').includes(club);
    card.style.display = show ? '' : 'none';
  });
}

function switchTab(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.getElementById('clubrow').style.display = (id === 'panel-tracked' || id === 'panel-tbc') ? 'flex' : 'none';
  window.scrollTo({top: 0, behavior: 'instant'});
}

function build() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">歐洲十一豪門 · 台灣時間賽程 · 手機版</div>
      <h1>愛足球⚽️賽程表</h1>
      <div class="callout"><span class="dot"></span><span><strong>Discord 自動提醒已啟用</strong> — 追蹤球隊的比賽開賽前約1小時會自動發送通知。</span></div>
      <nav class="tabs">
        <button data-tab="panel-tracked" class="active">追蹤球隊 ${FIXTURES.length}</button>
        <button data-tab="panel-tbc">時間未定 ${TBC.length}</button>
        <button data-tab="panel-ucl"><img src="${COMPETITION_LOGOS['UEFA Champions League']}" alt="">歐冠 ${UCL_ALL.length}</button>
        <button data-tab="panel-unl"><img src="${COMPETITION_LOGOS['UEFA Nations League']}" alt="">歐國聯 ${UNL_ALL.length}</button>
      </nav>
    </header>
    <div class="clubrow" id="clubrow"></div>
    <main>
      <div class="panel active" id="panel-tracked"></div>
      <div class="panel" id="panel-tbc"></div>
      <div class="panel" id="panel-ucl"></div>
      <div class="panel" id="panel-unl"></div>
      <footer>
        <div><strong>轉播說明：</strong>巴塞隆納、皇家馬德里的西甲賽事由 <strong>DAZN2（MOD 214台）</strong>轉播；兩隊的歐冠賽事及其餘9隊所有賽事由<strong>愛爾達 ELTA</strong>轉播（已標示實際頻道）。</div>
        <div><strong>無轉播確認：</strong>英格蘭聯賽盃、德國盃不在愛爾達轉播項目中，目前查無台灣轉播。</div>
        <div>9/21–9/24 國際賽週期五大聯賽暫無賽事；9/25起為歐國聯比賽週（見上方分頁）。</div>
        <div>資料整理：2026-08-31</div>
      </footer>
    </main>
  `;

  renderFixtureCards(document.getElementById('panel-tracked'), FIXTURES);
  renderTBC(document.getElementById('panel-tbc'));
  renderGenericCards(document.getElementById('panel-ucl'), UCL_ALL, true);
  renderGenericCards(document.getElementById('panel-unl'), UNL_ALL, false);

  const clubrow = document.getElementById('clubrow');
  const reset = document.createElement('div');
  reset.className = 'clubchip reset active';
  reset.textContent = '全部';
  reset.onclick = () => setClubFilter(null);
  clubrow.appendChild(reset);
  Object.keys(CLUBS).forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'clubchip';
    chip.dataset.club = name;
    chip.innerHTML = `<img src="${CLUBS[name].crest}" alt="">${name}`;
    chip.onclick = () => setClubFilter(name);
    clubrow.appendChild(chip);
  });

  document.querySelectorAll('nav.tabs button').forEach(b => {
    b.addEventListener('click', () => switchTab(b.dataset.tab));
  });
}

build();
</script>
